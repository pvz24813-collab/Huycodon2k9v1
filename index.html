<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple 2048</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:#faf8ef;
}
h1{margin:10px;}
#board{
    width:320px;
    height:320px;
    margin:10px auto;
    background:#bbada0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:5px;
    padding:5px;
}
.tile{
    background:#cdc1b4;
    font-size:24px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}
.controls{
    margin-top:15px;
}
button{
    width:60px;
    height:60px;
    font-size:24px;
    margin:5px;
}
</style>
</head>
<body>

<h1>2048 Mini</h1>
<div id="board"></div>

<div class="controls">
    <div>
        <button onclick="move('up')">↑</button>
    </div>
    <div>
        <button onclick="move('left')">←</button>
        <button onclick="move('down')">↓</button>
        <button onclick="move('right')">→</button>
    </div>
</div>

<script>
let board = [];
const size = 4;
const boardDiv = document.getElementById("board");

function init(){
    board = Array(size).fill().map(()=>Array(size).fill(0));
    addTile();
    addTile();
    draw();
}

function draw(){
    boardDiv.innerHTML="";
    for(let r=0;r<size;r++){
        for(let c=0;c<size;c++){
            const tile=document.createElement("div");
            tile.className="tile";
            tile.textContent=board[r][c]===0?"":board[r][c];
            boardDiv.appendChild(tile);
        }
    }
}

function addTile(){
    let empty=[];
    for(let r=0;r<size;r++){
        for(let c=0;c<size;c++){
            if(board[r][c]===0) empty.push({r,c});
        }
    }
    if(empty.length===0) return;
    let spot=empty[Math.floor(Math.random()*empty.length)];
    board[spot.r][spot.c]=Math.random()<0.9?2:4;
}

function slide(row){
    row=row.filter(v=>v);
    for(let i=0;i<row.length-1;i++){
        if(row[i]===row[i+1]){
            row[i]*=2;
            row[i+1]=0;
        }
    }
    row=row.filter(v=>v);
    while(row.length<size) row.push(0);
    return row;
}

function rotate(){
    let newBoard=Array(size).fill().map(()=>Array(size).fill(0));
    for(let r=0;r<size;r++)
        for(let c=0;c<size;c++)
            newBoard[c][size-1-r]=board[r][c];
    board=newBoard;
}

function move(dir){
    let rotated=false;
    if(dir==="up"){rotate();rotate();rotate();rotated=true;}
    if(dir==="right"){rotate();rotate();rotated=true;}
    if(dir==="down"){rotate();rotated=true;}

    for(let r=0;r<size;r++)
        board[r]=slide(board[r]);

    if(rotated){
        if(dir==="up"){rotate();}
        if(dir==="right"){rotate();rotate();}
        if(dir==="down"){rotate();rotate();rotate();}
    }

    addTile();
    draw();
}

init();
</script>

</body>
</html>
