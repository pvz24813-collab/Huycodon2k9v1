<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tìm Kiếm Nội Dung File</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        #results { margin-top: 20px; padding: 10px; border-top: 2px solid #eee; }
        .highlight { background-color: yellow; font-weight: bold; }
        .line-item { padding: 5px; border-bottom: 1px solid #fafafa; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 Tìm kiếm trong file .txt</h2>
    
    <label for="fileInput">Chọn file từ máy của bạn:</label>
    <input type="file" id="fileInput" accept=".txt,.sh,.py">

    <label for="searchInput">Nhập từ khóa cần tìm:</label>
    <input type="text" id="searchInput" placeholder="Ví dụ: 'teleport' hoặc '580vnx'..." disabled>

    <div id="results">
        <strong>Kết quả tìm kiếm:</strong>
        <div id="outputList"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const outputList = document.getElementById('outputList');
    let fileContent = "";

    // Đọc file khi người dùng chọn
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            fileContent = e.target.result;
            searchInput.disabled = false; // Cho phép tìm kiếm sau khi đã tải file
            searchInput.placeholder = "Bắt đầu nhập để tìm...";
        };
        reader.readAsText(file);
    });

    // Xử lý tìm kiếm khi nhập liệu
    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        outputList.innerHTML = ""; // Xóa kết quả cũ

        if (query === "") return;

        const lines = fileContent.split('\n');
        const filteredLines = lines.filter(line => line.toLowerCase().includes(query));

        if (filteredLines.length > 0) {
            filteredLines.forEach(line => {
                const div = document.createElement('div');
                div.className = 'line-item';
                // Đánh dấu từ khóa tìm thấy
                const regex = new RegExp(`(${query})`, 'gi');
                div.innerHTML = line.replace(regex, '<span class="highlight">$1</span>');
                outputList.appendChild(div);
            });
        } else {
            outputList.innerHTML = "<p style='color: gray;'>Không tìm thấy kết quả phù hợp.</p>";
        }
    });
</script>

</body>
</html>
